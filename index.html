<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de presença | Comlurb diretoria DSU</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #1d3969;
      --muted: #455674;
      --orange: #a64a12;
      --peach: #fff1e4;
      --line: #d7e1ef;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(18px, 6vw, 64px) 14px;
      background:
        radial-gradient(ellipse at top right, #fff2e6, transparent 48%),
        linear-gradient(145deg, #eaf0f8, #f7f9fc 55%, #edf2f8);
      color: var(--navy);
      font: 1rem/1.55 "Inter", system-ui, sans-serif;
    }

    main {
      position: relative;
      max-width: 36rem;
      margin: 0 auto;
      padding: clamp(20px, 5vw, 40px);
      border: 1px solid #f1b88f;
      border-radius: 26px;
      background: linear-gradient(150deg, #fff 55%, #f7f9fd);
      box-shadow: 0 16px 40px #20385b18;
    }

    main::before {
      position: absolute;
      top: 0;
      left: clamp(20px, 5vw, 40px);
      width: 60px;
      height: 4px;
      border-radius: 0 0 4px 4px;
      background: linear-gradient(90deg, #244477, #eb9459);
      content: "";
    }

    header { margin-bottom: 24px; }

    .brand {
      display: inline-block;
      margin: 0 0 12px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--peach);
      color: var(--orange);
      font-size: .875rem;
      font-weight: 750;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 6.5vw, 2.45rem);
      line-height: 1.12;
      letter-spacing: -.035em;
    }

    .instructions { margin: 0 0 20px; color: var(--muted); }

    button {
      width: 100%;
      min-height: 54px;
      padding: 12px 18px;
      border: 0;
      border-radius: 999px;
      background: var(--navy);
      color: #fff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    button:hover:enabled { background: #284d83; }
    button:focus-visible { outline: 3px solid #b95118; outline-offset: 3px; }
    button:disabled { opacity: .62; cursor: default; }

    #manual { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line); }
    summary { cursor: pointer; font-weight: 700; }
    form { display: grid; gap: 10px; margin-top: 12px; }
    input {
      width: 100%;
      min-height: 48px;
      padding: 10px 14px;
      border: 1px solid #8396b2;
      border-radius: 14px;
      color: var(--navy);
      font: inherit;
    }
    input:focus-visible, summary:focus-visible { outline: 3px solid #b95118; outline-offset: 3px; }

    #status {
      margin: 16px 0 0;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #edf3fb;
      color: var(--navy);
      font-size: .9375rem;
    }

    #result {
      margin-top: 22px;
      padding: 16px;
      border: 1px solid #f1b88f;
      border-radius: 18px;
      background: #fff;
    }

    h2 { margin: 0 0 12px; font-size: 1.125rem; }

    dl {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 9px 14px;
      margin: 0;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }

    dt { color: var(--muted); font-weight: 700; }
    dd { margin: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="brand">Comlurb diretoria DSU</p>
      <h1>Registro de presença</h1>
    </header>
    <p class="instructions">Ative o NFC e toque em Ler crachá. Autorize a localização para gravar as coordenadas junto com a presença.</p>
    <button id="scan" type="button" disabled>Ler crachá</button>
    <details id="manual" hidden>
      <summary>Registrar por matrícula</summary>
      <form id="manual-form">
        <label for="employee-id">Matrícula do funcionário</label>
        <input id="employee-id" type="text" inputmode="numeric" pattern="[0-9]{1,20}" maxlength="20" required>
        <button id="manual-submit" type="submit">Registrar presença</button>
      </form>
    </details>
    <p id="status" role="status">Verificando o acesso.</p>
    <section id="result" hidden>
      <h2>Dados da leitura</h2>
      <dl>
        <dt>Matrícula</dt><dd id="matricula"></dd>
        <dt>Nome</dt><dd id="nome"></dd>
        <dt>Gerência</dt><dd id="gerencia"></dd>
        <dt>Data</dt><dd id="data"></dd>
        <dt>Hora</dt><dd id="hora"></dd>
      </dl>
    </section>
  </main>
  <script>
    const endpoint = 'https://script.google.com/macros/s/AKfycbzU6bfpQqdY4LhI2b8-fGf-cI2279pjozxJ1xAgTVRbcj8FbY20iOI3vKMjsbpmcgJV/exec';
    const access = new URLSearchParams(location.hash.slice(1)).get('acesso');
    const scan = document.querySelector('#scan');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');
    const manual = document.querySelector('#manual');
    const form = document.querySelector('#manual-form');
    const employeeId = document.querySelector('#employee-id');
    const manualSubmit = document.querySelector('#manual-submit');
    const canScan = window.isSecureContext && 'NDEFReader' in window;

    function setBusy(busy) {
      scan.disabled = busy || !canScan;
      employeeId.disabled = busy;
      manualSubmit.disabled = busy;
    }

    async function enableManualRegistration() {
      try {
        const response = await fetch(endpoint, { credentials: 'omit', cache: 'no-store' });
        if (!response.ok || (await response.json()).registroPorMatricula !== true) return;
        manual.hidden = false;
        if (!canScan) status.textContent = 'Digite a matrícula para registrar a presença.';
      } catch {
        // Older deployments only accept NFC registrations.
      }
    }

    if (!window.isSecureContext) {
      status.textContent = 'Abra o site no Chrome de um Android com NFC.';
    } else if (!access || !/^[a-f0-9]{64}$/.test(access)) {
      status.textContent = 'Abra o seu link de acesso para usar o leitor.';
    } else {
      status.textContent = canScan
        ? 'Toque em Ler crachá para começar.'
        : 'Para ler um crachá, abra o site no Chrome de um Android com NFC.';
      setBusy(false);
      enableManualRegistration();
    }

    function getCoordinates() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve(null);
          return;
        }
        const deadline = setTimeout(() => resolve(null), 22000);
        function finish(coordinates) {
          clearTimeout(deadline);
          resolve(coordinates);
        }
        navigator.geolocation.getCurrentPosition(
          ({ coords }) => finish(coords),
          () => finish(null),
          { enableHighAccuracy: false, maximumAge: 0, timeout: 20000 }
        );
      });
    }

    async function register(identifier) {
      if ('serial' in identifier && !identifier.serial) return 'O Chrome não forneceu o número de série do crachá.';
      status.textContent = 'Obtendo a localização do celular.';
      const coordinates = await getCoordinates();
      status.textContent = 'Gravando presença na planilha.';
      const response = await fetch(endpoint, {
        method: 'POST',
        credentials: 'omit',
        body: JSON.stringify({ access, ...identifier, latitude: coordinates?.latitude, longitude: coordinates?.longitude })
      });
      if (!response.ok) throw new Error('Falha na resposta');
      const receipt = await response.json();
      if (receipt.error) return receipt.error;
      const { matricula, nome, gerencia, data, hora, located } = receipt;
      if (typeof located !== 'boolean') throw new Error('Confirmação ausente');
      for (const [id, value] of Object.entries({ matricula, nome, gerencia, data, hora })) {
        document.getElementById(id).textContent = value;
      }
      result.hidden = false;
      if ('matricula' in identifier) form.reset();
      return located
        ? 'Presença registrada com localização.'
        : 'Presença registrada sem localização. Confira a permissão de localização do navegador.';
    }

    async function submitPresence(identifier) {
      try {
        return await register(identifier);
      } catch {
        return 'A gravação não foi confirmada. Confira a planilha antes de repetir.';
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (manual.hidden || manualSubmit.disabled) return;
      const matricula = employeeId.value.trim();
      result.hidden = true;
      setBusy(true);
      status.textContent = await submitPresence({ matricula });
      setBusy(false);
    });

    scan.addEventListener('click', async () => {
      result.hidden = true;
      setBusy(true);
      status.textContent = 'Autorize o acesso ao NFC, se o Chrome solicitar.';
      const controller = new AbortController();
      const reader = new NDEFReader();
      let timeout;

      function stopReading() {
        clearTimeout(timeout);
        controller.abort();
      }

      function finish(message) {
        stopReading();
        setBusy(false);
        status.textContent = message;
      }

      reader.addEventListener('reading', async (event) => {
        stopReading();
        status.textContent = 'Consultando o cadastro.';
        finish(await submitPresence({ serial: event.serialNumber || '' }));
      }, { once: true, signal: controller.signal });
      reader.addEventListener('readingerror', () => {
        status.textContent = 'O Chrome não conseguiu ler a etiqueta. Afaste o crachá e aproxime novamente.';
      }, { signal: controller.signal });

      try {
        await reader.scan({ signal: controller.signal });
        if (controller.signal.aborted) return;
        status.textContent = 'Aproxime o crachá da traseira do celular.';
        timeout = setTimeout(() => finish('Nenhuma leitura concluída. Confira se o NFC está ativo e tente de novo.'), 25000);
      } catch (error) {
        finish(error.name === 'NotAllowedError'
          ? 'Permita o acesso ao NFC nas configurações do Chrome e tente novamente.'
          : 'A leitura não pôde ser iniciada. Confira se o NFC está ativo e tente novamente.');
      }
    });
  </script>
</body>
</html>
